<style>
/* ═══════════════════════════════════════════════════════════════════
   TOKENS — shared with strategy-briefing.html / press.html
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#FBFAF8; --surface:#FFFFFF; --surface-2:#F3F1ED; --ink:#191B1F; --ink-2:#53575E;
  --ink-3:#83878E; --accent:#B0125E; --accent-soft:#FAEEF3; --line:#E6E3DE; --line-2:#D3CFC9;
  --on-accent:#FFFFFF;
  --e-move:#B0125E; --e-make:#8A5A12; --e-serve:#2B6B57; --e-broker:#2F6F9F;
  --e-move-soft:#FAEEF3; --e-make-soft:#F7F0E2; --e-serve-soft:#E8F1ED; --e-broker-soft:#E9F0F6;
  --linen:rgba(25,27,31,.038);
  --ghost:.055;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15171B; --surface:#1C1F25; --surface-2:#23272F; --ink:#F1EEEC; --ink-2:#AAAEB5;
    --ink-3:#787D86; --accent:#E85EA0; --accent-soft:#2C1A23; --line:#2B2F37; --line-2:#3B404A;
    --on-accent:#15171B;
    --e-move:#E85EA0; --e-make:#D9A55A; --e-serve:#6FBF9F; --e-broker:#6FA9DC;
    --e-move-soft:#2C1A23; --e-make-soft:#2A2415; --e-serve-soft:#152720; --e-broker-soft:#161F2A;
    --linen:rgba(255,255,255,.030);
    --ghost:.075;
  }
}
:root[data-theme="dark"]{
  --bg:#15171B; --surface:#1C1F25; --surface-2:#23272F; --ink:#F1EEEC; --ink-2:#AAAEB5;
  --ink-3:#787D86; --accent:#E85EA0; --accent-soft:#2C1A23; --line:#2B2F37; --line-2:#3B404A;
  --on-accent:#15171B;
  --e-move:#E85EA0; --e-make:#D9A55A; --e-serve:#6FBF9F; --e-broker:#6FA9DC;
  --e-move-soft:#2C1A23; --e-make-soft:#2A2415; --e-serve-soft:#152720; --e-broker-soft:#161F2A;
  --linen:rgba(255,255,255,.030);
  --ghost:.075;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;
}
h1,h2,h3,h4{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:600;line-height:1.14;margin:0;text-wrap:balance}
a{color:inherit}

/* ── Chrome ─────────────────────────────────────────────────────── */
#chrome{
  height:52px;display:flex;align-items:center;gap:12px;padding:0 18px;
  border-bottom:1px solid var(--line);background:var(--surface);
  position:relative;z-index:40;transition:transform .3s ease,opacity .3s ease;
}
.brandmark{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:.92rem;color:var(--accent);letter-spacing:.02em;white-space:nowrap}
.chrome-title{font-size:.74rem;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.spacer{flex:1 1 auto;min-width:0}
/* One shape system across the page: everything is square. Rounded pills are
   what makes a document read as a web app rather than a printed thing. */
.btn{
  font:inherit;font-size:.75rem;font-weight:600;color:var(--ink-2);background:transparent;
  border:1px solid var(--line);border-radius:0;padding:6px 13px;cursor:pointer;white-space:nowrap;
  transition:transform 160ms var(--ease-out),border-color 160ms ease,color 160ms ease;
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
  .backlinks a:hover{border-color:var(--accent);color:var(--accent)}
}
.btn:focus-visible,a:focus-visible,#loom:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.backlinks{display:flex;gap:6px}
.backlinks a{
  font-size:.72rem;text-decoration:none;color:var(--ink-3);
  border:1px solid var(--line);border-radius:0;padding:5px 11px;
  transition:border-color 160ms ease,color 160ms ease;
}

/* ── The loom (scroll viewport) ─────────────────────────────────── */
#loom{
  height:calc(100dvh - 52px - 66px);
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x proximity;scroll-behavior:smooth;
  cursor:grab;position:relative;
  background:
    repeating-linear-gradient(90deg,var(--linen) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(0deg,var(--linen) 0 1px,transparent 1px 3px),
    var(--bg);
}
#loom.grabbing{cursor:grabbing;scroll-behavior:auto}
#loom::-webkit-scrollbar{height:8px}
#loom::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px}
#loom::-webkit-scrollbar-track{background:transparent}

#cloth{
  display:grid;
  grid-template-rows:var(--bh,74px) minmax(0,1fr) var(--bh,74px);
  grid-auto-flow:column;
  grid-auto-columns:var(--sw);
  min-height:100%;height:100%;
  --sw:min(94vw,1120px);
}

/* ── Borders (upper = provenance, lower = machinery) ────────────── */
.bt,.bb{
  padding:10px 30px;display:flex;flex-direction:column;justify-content:center;gap:3px;
  border-right:1px solid var(--line);overflow:hidden;
  transition:opacity .3s ease,padding .3s ease;
}
.bt{background:var(--surface-2);border-bottom:1px solid var(--line)}
.bb{background:var(--surface-2);border-top:1px solid var(--line)}
.bt .lab,.bb .lab{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.bt .val{font-size:.83rem;color:var(--ink-2);line-height:1.4}
.bb .val{font-size:.83rem;color:var(--ink-2);line-height:1.4}
.bt .val b,.bb .val b{color:var(--ink);font-weight:600}

/* ── Scenes (main register) ─────────────────────────────────────── */
.scene{
  padding:24px 30px;border-right:1px solid var(--line);
  scroll-snap-align:center;overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;gap:11px;justify-content:safe center;
  font-size:1rem;position:relative;
}
.scene::-webkit-scrollbar{width:6px}
.scene::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px}
.scene.is-current{background:var(--surface)}

/* The scene numeral, set large and ghosted behind the title the way a
   manuscript carries its folio number. Replaces the small-caps eyebrow. */
.ghost{
  position:absolute;top:10px;right:26px;
  font-family:Fraunces,Georgia,serif;font-weight:600;
  font-size:7.2em;line-height:1;letter-spacing:-.03em;
  font-variation-settings:"opsz" 144;
  color:var(--sc,var(--accent));opacity:var(--ghost);
  pointer-events:none;user-select:none;
}
.kicker{
  font-family:Fraunces,Georgia,serif;font-size:.86em;font-style:italic;
  color:var(--sc,var(--accent));
}
.scene h2{
  font-size:1.95em;color:var(--ink);margin:.06em 0 .1em;letter-spacing:-.018em;
  font-variation-settings:"opsz" 144;
}
.scene .lede{font-size:1.06em;color:var(--ink-2);max-width:62ch;margin:0}
.scene p{margin:0;max-width:66ch;color:var(--ink-2);font-size:.97em}
.scene p b,.scene li b{color:var(--ink);font-weight:600}
.rule{height:2px;width:44px;background:var(--sc,var(--accent));margin:3px 0 5px}

/* Divisions read as catalogue entries: a hairline, a number, a name.
   No boxes, no left stripes, no shadows. */
.divs{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:0 38px}
.div{
  border-top:1px solid var(--line);padding:9px 0 10px;
  display:grid;grid-template-columns:1.9em 1fr;column-gap:12px;align-items:baseline;
}
.div .n{
  font-family:Fraunces,Georgia,serif;font-size:1.15em;font-weight:600;line-height:1;
  color:var(--sc,var(--accent));font-variant-numeric:tabular-nums lining-nums;
}
.div .nm{font-family:Fraunces,Georgia,serif;font-size:1.02em;font-weight:600;color:var(--ink);line-height:1.25}
.div .bl{grid-column:2;font-size:.85em;color:var(--ink-2);line-height:1.48;margin-top:2px}
.div .pt{grid-column:2;font-size:.78em;color:var(--ink-3);margin-top:4px}
.div .pt b{color:var(--sc,var(--accent));font-weight:600}
.div .new{
  font-family:"Hanken Grotesk",sans-serif;font-size:.5em;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--sc,var(--accent));vertical-align:.35em;margin-left:6px;
}

/* The competitive field: a hairline register, not a row of pills.
   Hackett & Hackett is marked by a heavier rule, not a coloured chip. */
.field{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 30px}
.field div{border-top:1px solid var(--line);padding:8px 0 9px}
.field .who{font-family:Fraunces,Georgia,serif;font-size:.97em;color:var(--ink);display:block}
.field .what{font-size:.82em;color:var(--ink-3);line-height:1.45}
.field .us{border-top:2px solid var(--sc,var(--accent))}
.field .us .who{color:var(--sc,var(--accent))}
.field .us .what{color:var(--ink-2)}

/* A note is a rule and an indent, not a tinted box. */
.note{
  border-top:1px solid var(--sc,var(--accent));padding:9px 0 0;
  font-size:.9em;color:var(--ink-2);max-width:68ch;
}
.note b{color:var(--ink);font-weight:600}

.stats{display:flex;flex-wrap:wrap;gap:0 40px}
.stat{border-top:1px solid var(--line);padding:9px 0 0;min-width:96px}
.stat .k{
  font-family:Fraunces,Georgia,serif;font-size:2.1em;font-weight:600;line-height:1;
  color:var(--ink);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.02em;
  font-variation-settings:"opsz" 144;
}
.stat .l{font-size:.72em;color:var(--ink-3);margin-top:4px}

/* The one place a left rule is correct typography: a pull quote. */
.pull{
  font-family:Fraunces,Georgia,serif;font-size:1.32em;line-height:1.36;color:var(--ink);
  border-left:1px solid var(--sc,var(--accent));padding-left:18px;max-width:50ch;font-style:italic;
}
.cite{font-size:.72em;color:var(--ink-3);font-style:normal;display:block;margin-top:7px}

ol.steps{
  margin:0;padding:0;list-style:none;counter-reset:s;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));
  gap:0 34px;align-items:start;
}
ol.steps li{
  border-top:1px solid var(--line);padding:9px 0 10px;font-size:.9em;
  color:var(--ink-2);line-height:1.5;counter-increment:s;
  padding-left:1.7em;text-indent:-1.7em;  /* hanging figure */
}
ol.steps li::before{
  content:counter(s) "\00a0\00a0";
  font-family:Fraunces,Georgia,serif;font-weight:600;color:var(--sc,var(--accent));
  font-variant-numeric:tabular-nums lining-nums;
}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:0 38px}
.card{border-top:1px solid var(--line);padding:10px 0 11px}
.card h4{font-size:1.02em;color:var(--ink);margin-bottom:4px}
.card p{font-size:.87em;line-height:1.5}

/* Governance reads as a register of posts, filled and unfilled. */
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 38px}
.rung{display:flex;align-items:baseline;gap:12px;border-top:1px solid var(--line);padding:8px 0 9px}
.rung .tier{font-size:.72em;color:var(--ink-3);min-width:46px}
.rung .role{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:.97em;color:var(--ink);flex:1}
.rung .who{font-size:.82em;color:var(--ink-2);text-align:right}
.rung .who.open{color:var(--ink-3);font-style:italic}

/* ── Thread (minimap) ───────────────────────────────────────────── */
#thread{
  height:66px;border-top:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;gap:0;padding:0 18px;overflow-x:auto;
  position:relative;z-index:30;transition:height .3s ease,opacity .3s ease;
}
#thread::-webkit-scrollbar{display:none}
#thread{scrollbar-width:none}
.tick{
  flex:1 0 auto;min-width:74px;background:none;border:0;cursor:pointer;font:inherit;
  padding:8px 6px;text-align:center;position:relative;color:var(--ink-3);
}
.tick::before{
  content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line-2);
}
.tick .dot{
  position:relative;display:block;width:9px;height:9px;border-radius:50%;
  background:var(--surface);border:1.5px solid var(--line-2);margin:0 auto 5px;transition:all .2s;
}
.tick .rn{position:relative;display:block;font-family:Fraunces,Georgia,serif;font-size:.66rem;letter-spacing:.08em;line-height:1}
.tick .tl{position:relative;display:block;font-size:.62rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick:hover{color:var(--ink)}
.tick:hover .dot{border-color:var(--accent)}
.tick.on{color:var(--tc,var(--accent))}
.tick.on .dot{background:var(--tc,var(--accent));border-color:var(--tc,var(--accent));transform:scale(1.35)}
.tick.on .rn{font-weight:700}

/* ── PRESENT MODE ───────────────────────────────────────────────── */
body.present #chrome{transform:translateY(-100%);opacity:0;position:absolute;top:0;left:0;right:0}
body.present #loom{height:calc(100dvh - 26px);scroll-snap-type:x mandatory}
body.present #cloth{--bh:22px;--sw:100vw}
body.present .bt,body.present .bb{opacity:.32;padding:0 30px;pointer-events:none}
body.present .bt .lab,body.present .bb .lab{display:none}
body.present .bt .val,body.present .bb .val{font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Type scales on the smaller of width and height: vertical space is the real
   constraint on a laptop, and a scene that overflows in front of an audience
   is a scene they cannot read. */
body.present .scene{font-size:clamp(.95rem,min(1.3vw,2vh),1.5rem);padding:min(4.5vh,46px) clamp(30px,7vw,120px);justify-content:safe center;gap:min(1.7vh,16px)}
body.present .scene:not(.is-current){opacity:.25;transition:opacity .4s ease}
body.present #thread{height:26px;padding:0 18px}
body.present .tick{padding:0;min-width:0}
body.present .tick .rn,body.present .tick .tl{display:none}
body.present .tick .dot{width:6px;height:6px;margin:0 auto}
.escape-hint,.counter{display:none}
body.present .escape-hint{
  display:block;position:fixed;bottom:34px;right:20px;font-size:.66rem;color:var(--ink-3);
  letter-spacing:.1em;text-transform:uppercase;z-index:50;pointer-events:none;
}
body.present .counter{
  display:block;position:fixed;top:18px;right:24px;z-index:50;font-size:.7rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);pointer-events:none;font-weight:600;
}
/* No scrollbar furniture while presenting. */
body.present #loom{scrollbar-width:none}
body.present #loom::-webkit-scrollbar{display:none}

/* ── Short viewports (13-inch laptops, 768px-tall projectors) ───── */
@media (max-height:840px){
  .scene{font-size:.93rem;padding:18px 28px;gap:9px}
  .scene h2{font-size:1.78em}
  #cloth{--bh:64px}
}

/* ── Small screens ──────────────────────────────────────────────── */
@media (max-width:720px){
  #cloth{--sw:94vw;--bh:62px}
  .scene{padding:22px}
  .scene h2{font-size:1.6em}
  .backlinks{display:none}
  .chrome-title{display:none}
}

/* ── Print: unwrap the cloth into a linear document ─────────────── */
@media print{
  @page{margin:16mm}
  /* Paper is always light, whichever theme is on screen. Without this the dark
     tokens survive and print grey text on white. */
  :root,:root[data-theme="dark"],:root[data-theme="light"]{
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#FFFFFF; --ink:#000000; --ink-2:#2A2D33;
    --ink-3:#5C6068; --accent:#8E0F4D; --accent-soft:#FBF2F6; --line:#BFBCB7; --line-2:#9E9A94;
    --e-move:#8E0F4D; --e-make:#6E4710; --e-serve:#215544; --e-broker:#245A80;
    --e-move-soft:#FBF2F6; --e-make-soft:#FAF5EA; --e-serve-soft:#F0F6F3; --e-broker-soft:#F1F6FA;
    --linen:transparent; --shadow:none;
  }
  body{overflow:visible;background:#fff;color:#000}
  #chrome,#thread,.escape-hint,.counter{display:none !important}
  #loom{height:auto;overflow:visible;background:#fff}
  #cloth{display:block;height:auto}
  .bt,.bb{border:0;background:#fff;padding:6px 0;display:block;opacity:1}
  /* Label and value are flex children on screen; make them stack on paper. */
  .bt .lab,.bt .val,.bb .lab,.bb .val{display:block}
  .bt .lab,.bb .lab{margin-bottom:2px}
  .bt{border-top:1px solid #ccc}
  .bb{border-bottom:2px solid #000;margin-bottom:14mm;padding-bottom:10px}
  .scene{
    display:block;border:0;padding:10px 0;overflow:visible;
    break-inside:avoid;page-break-inside:avoid;font-size:11pt;
  }
  .scene>*{margin-bottom:9px}
  .div,.card,.note,.rung{break-inside:avoid;box-shadow:none}
  .divs,.cols{display:block}
  .div,.card{margin-bottom:7px}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
  #loom{scroll-behavior:auto}
}
</style>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   DATA — THE ONLY BLOCK THAT NEEDS EDITING
   ══════════════════════════════════════════════════════════════════════════
   Change anything below and the tapestry redraws on reload.

   TO ADD A DIVISION (a 17th, 18th …):
     Add an object to DIVISIONS. Required: n, name, engine, blurb.
     `engine` must be one of: move · make · serve · broker
     `partners` is a list of names, or [] if none are named yet.
     Counts, engine groupings and the network scene all recalculate themselves.

   TO ADD A PROJECT:      add to PROJECTS.
   TO ADD A PARTNER:      add the name to that division's `partners` list.
   TO FILL A ROLE:        set `who` on the relevant GOVERNANCE row.
   TO RENAME AN ENGINE:   edit ENGINES[key].name.

   Division names are written exactly as the group structure names them.
   House style: always "Hackett & Hackett", ampersand spaced; never name a
   client, household or venue (press.html §7).
   ────────────────────────────────────────────────────────────────────────── */

const COMPANY = {
  legal:    "Hackett & Hackett International Group Limited",
  short:    "Hackett & Hackett",
  founded:  2009,
  years:    17,
  crn:      "07100605",
  address:  "167-169 Great Portland Street, London W1W 5PF",
  strap:    "Lifestyle Management & Production",
  closing:  "Extravagantly extraordinary, every time.",
  principle:"A company is only as good as the clientele it serves."
};

const ENGINES = {
  move:   { name:"Move",   line:"Getting the principal and their assets there, unnoticed." },

const cloth = document.getElementById("cloth");
const thread = document.getElementById("thread");
const counter = document.getElementById("counter");

SCENES.forEach((s, i) => {
  const c = s.colour || "move";

  top.style.cssText = vars;

    : "";

  scene.style.cssText = vars;
  scene.id = "scene-" + s.id;
  scene.dataset.i = i;

  scene.innerHTML =

     <div><span class="kicker">${s.kicker || (ENGINES[c] ? ENGINES[c].name : "The Group")}</span>
       <h2>${s.title}</h2><div class="rule"></div></div>` + s.build();

  const bot = document.createElement("div");

  bot.style.cssText = vars;
  bot.setAttribute("aria-hidden", "true");

    ? `<span class="val">${s.bottom.val}</span><span class="lab">${s.bottom.lab}</span>`
    : "";

  cloth.append(top, scene, bot);

  const tick = document.createElement("button");
  tick.className = "tick";
  tick.type = "button";

  tick.innerHTML = `<span class="dot"></span><span class="rn">${ROMAN[i]}</span><span class="tl">${s.title}</span>`;
  tick.addEventListener("click", () => goTo(i));

const scenes = [...cloth.querySelectorAll(".scene")];
const ticks  = [...thread.querySelectorAll(".tick")];
const loom   = document.getElementById("loom");
let current = 0;

/* ══════════════════════════════════════════════════════════════════════════
   CAMERA — explore and present share one document
   ══════════════════════════════════════════════════════════════════════════ */
function goTo(i){
  current = Math.max(0, Math.min(scenes.length - 1, i));
  scenes[current].scrollIntoView({
    behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth",
    inline: "center", block: "nearest"
  });
  mark();
}

function mark(){
  scenes.forEach((s, i) => s.classList.toggle("is-current", i === current));
  ticks.forEach((t, i) => {
    t.classList.toggle("on", i === current);
    t.setAttribute("aria-current", i === current ? "true" : "false");
  });
  counter.textContent = `${PLATE(current)} / ${String(scenes.length).padStart(2, "0")}`;
}

/* Track position while the user scrolls freely. */
const io = new IntersectionObserver(entries => {
  let best = null;
  for (const e of entries) if (e.isIntersecting && (!best || e.intersectionRatio > best.intersectionRatio)) best = e;
  if (best) { current = +best.target.dataset.i; mark(); }
}, { root: loom, threshold: [.45, .6, .8] });
scenes.forEach(s => io.observe(s));

function setPresent(on){
  document.body.classList.toggle("present", on);
  const btn = document.getElementById("present-btn");
  btn.setAttribute("aria-pressed", String(on));
  btn.innerHTML = on ? "Exit &nbsp;Esc" : "Present &nbsp;P";
  requestAnimationFrame(() => goTo(current));
}

document.getElementById("present-btn").addEventListener("click",
  () => setPresent(!document.body.classList.contains("present")));
document.getElementById("print-btn").addEventListener("click", () => window.print());

/* Theme, shared across the briefing set via the `hh-theme` key. */
document.getElementById("theme-btn").addEventListener("click", () => {
  const now = document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  const next = now === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("hh-theme", next); } catch (e) {}
});

/* Keyboard. Arrows and space move along the cloth; P presents; Esc exits. */
addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (typing) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); goTo(current + 1); }
  else if (k === "ArrowLeft" || k === "PageUp")            { e.preventDefault(); goTo(current - 1); }
  else if (k === "Home")                                    { e.preventDefault(); goTo(0); }
  else if (k === "End")                                     { e.preventDefault(); goTo(scenes.length - 1); }
  else if (k === "p" || k === "P")                          { setPresent(!document.body.classList.contains("present")); }
  else if (k === "Escape" && document.body.classList.contains("present")) { setPresent(false); }
});

/* Vertical wheel pans the cloth, unless the scene under the pointer has its
   own vertical overflow still to give. */
loom.addEventListener("wheel", e => {
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  const scene = e.target.closest(".scene");
  if (scene && scene.scrollHeight > scene.clientHeight + 4) {
    const atTop = scene.scrollTop <= 0, atEnd = scene.scrollTop + scene.clientHeight >= scene.scrollHeight - 1;
    if (!(e.deltaY < 0 && atTop) && !(e.deltaY > 0 && atEnd)) return;
  }
  e.preventDefault();
  loom.scrollLeft += e.deltaY;
}, { passive: false });

/* Drag to pan. */
let dragging = false, startX = 0, startL = 0;
loom.addEventListener("pointerdown", e => {
  if (e.target.closest("a,button,input,textarea,select")) return;
  dragging = true; startX = e.clientX; startL = loom.scrollLeft;
  loom.classList.add("grabbing");
});
addEventListener("pointermove", e => { if (dragging) loom.scrollLeft = startL - (e.clientX - startX); });
addEventListener("pointerup", () => { dragging = false; loom.classList.remove("grabbing"); });

mark();
</script>
