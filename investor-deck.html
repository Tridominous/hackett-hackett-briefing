<style>

*{box-sizing:border-box}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:600;line-height:1.12;margin:0;text-wrap:balance}

.slide{
  min-height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;
  display:flex;flex-direction:column;justify-content:center;
  padding:clamp(30px,5vh,64px) clamp(28px,7vw,130px);
  border-bottom:1px solid var(--line);position:relative;
  font-size:clamp(.95rem,min(1.25vw,1.95vh),1.45rem);
  gap:clamp(10px,1.7vh,20px);
}
.kick{
  font-family:Fraunces,Georgia,serif;font-size:.88em;font-style:italic;
  color:var(--sc,var(--accent));
}
.slide h2{font-size:2.5em;color:var(--ink);letter-spacing:-.02em;font-variation-settings:"opsz" 144}
.slide h1{font-size:3.4em;color:var(--ink);letter-spacing:-.025em;font-variation-settings:"opsz" 144}
.rule{height:2px;width:48px;background:var(--sc,var(--accent))}
.slide p{margin:0;color:var(--ink-2);font-size:1.02em;max-width:62ch;line-height:1.55}
.slide p b,li b,td b{color:var(--ink);font-weight:600}
.big{font-family:Fraunces,Georgia,serif;font-size:1.85em;line-height:1.3;color:var(--ink);max-width:24ch}
.sub{color:var(--ink-3);font-size:.88em}

/* Rules and space, not boxes. A bordered card on every item is the tell. */
.cols{display:grid;gap:0 clamp(24px,3vw,44px);grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{border-top:1px solid var(--line);padding:clamp(9px,1.4vh,14px) 0 clamp(10px,1.5vh,15px)}
.card h4{font-size:1.02em;margin-bottom:.25em;color:var(--ink)}
.card p{font-size:.88em;line-height:1.5}
.card .tiny{font-size:.76em;color:var(--sc,var(--accent));margin-top:6px;display:block}

.stats{display:flex;flex-wrap:wrap;gap:0 clamp(22px,3.6vw,54px)}
.stat{border-top:1px solid var(--line);padding:10px 0 0;min-width:104px}
.stat .k{
  font-family:Fraunces,Georgia,serif;font-size:2.7em;font-weight:600;color:var(--ink);line-height:1;
  font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.025em;font-variation-settings:"opsz" 144;

.stat .l{font-size:.74em;color:var(--ink-3);margin-top:5px}

.note{border-top:1px solid var(--sc,var(--accent));padding:10px 0 0;font-size:.92em;color:var(--ink-2);max-width:70ch}
.note b{color:var(--ink)}

/* Revenue flow. Here containment is the point, so the boxes stay, but they
   are hairline and square rather than shadowed cards. */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow .fbox{flex:1 1 190px;border:1px solid var(--line);padding:13px 16px}
.flow .fbox.mid{border-color:var(--accent);border-width:1px 1px 2px}
.flow .fbox h4{font-size:.98em;margin-bottom:.25em}
.flow .fbox.mid h4{color:var(--accent)}

.flow .arrow{display:flex;align-items:center;color:var(--ink-3);font-size:1.1em;flex:0 0 auto;padding:0 12px}
@media (max-width:760px){.flow .arrow{transform:rotate(90deg);padding:8px 0}}

/* Each engine is a column under a coloured rule, not a card. */
.engines{display:grid;gap:0 clamp(20px,2.6vw,38px);grid-template-columns:repeat(auto-fit,minmax(205px,1fr))}
.eng{border-top:2px solid var(--ec);padding:11px 0 0}

.eng .cnt{font-size:.74em;color:var(--ink-3);margin-bottom:4px;font-variant-numeric:tabular-nums lining-nums}
.eng ul{margin:7px 0 0;padding:0;list-style:none}
.eng li{font-size:.85em;color:var(--ink-2);margin:3px 0;line-height:1.4}

.field{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:0 clamp(20px,2.6vw,34px)}
.field div{border-top:1px solid var(--line);padding:8px 0 9px}
.field .who{font-family:Fraunces,Georgia,serif;font-size:.98em;color:var(--ink);display:block}
.field .what{font-size:.83em;color:var(--ink-3);line-height:1.45}

/* Chrome */
#bar{position:fixed;top:0;left:0;right:0;height:3px;background:transparent;z-index:60}

/* ── Render ─────────────────────────────────────────────────────────────── */
const deck = document.getElementById("deck");
const dots = document.getElementById("dots");
const num  = document.getElementById("num");

SLIDES.forEach((s, i) => {
  const sec = document.createElement("section");
  sec.className = "slide";
  sec.style.setProperty("--sc", `var(--e-${s.c || "move"})`);
  sec.dataset.i = i;
  sec.setAttribute("aria-label", `Slide ${i + 1} of ${SLIDES.length}`);
  sec.innerHTML = (s.kick ? `<span class="kick">${s.kick}</span>` : "") + s.html;
  deck.append(sec);

  const d = document.createElement("button");
  d.type = "button";
  d.setAttribute("aria-label", `Go to slide ${i + 1}`);
  d.addEventListener("click", () => go(i));
  dots.append(d);
});

const slides = [...deck.children];
const dotEls = [...dots.children];
let cur = 0;

function go(i){
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides[cur].scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth" });
}
function mark(){
  dotEls.forEach((d, i) => d.classList.toggle("on", i === cur));
  num.textContent = `${cur + 1} / ${slides.length}`;
  document.querySelector("#bar i").style.width = ((cur + 1) / slides.length * 100) + "%";
}

const io = new IntersectionObserver(es => {
  let best = null;
  for (const e of es) if (e.isIntersecting && (!best || e.intersectionRatio > best.intersectionRatio)) best = e;
  if (best) { cur = +best.target.dataset.i; mark(); }
}, { threshold: [.4, .6, .8] });
slides.forEach(s => io.observe(s));

addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "ArrowDown" || k === "PageDown" || k === " ") { e.preventDefault(); go(cur + 1); }
  else if (k === "ArrowLeft" || k === "ArrowUp" || k === "PageUp")               { e.preventDefault(); go(cur - 1); }
  else if (k === "Home") { e.preventDefault(); go(0); }
  else if (k === "End")  { e.preventDefault(); go(slides.length - 1); }
});

document.getElementById("print-btn").addEventListener("click", () => window.print());
document.getElementById("theme-btn").addEventListener("click", () => {
  const now = document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  const next = now === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("hh-theme", next); } catch (e) {}
});

mark();
</script>
